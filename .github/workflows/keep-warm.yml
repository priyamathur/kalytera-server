name: keep-warm

# Render's free plan puts a service to sleep after 15 minutes without visitors, and the next
# visitor waits 30+ seconds. A visit every 10 minutes keeps the API and dashboard awake.
# Only on weekdays, 14:00–02:00 UTC (7am–7pm Pacific, 10am–10pm Eastern): free services share
# 750 hours a month, and both awake all the time would need about 1,490.
on:
  schedule:
    - cron: "*/10 14-23 * * 1-5"
    - cron: "*/10 0-1 * * 2-6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the API and the dashboard
        run: |
          curl -s -o /dev/null -w "api %{http_code} %{time_total}s\n" --max-time 120 https://api.kalytera.dev/health || true
          curl -s -o /dev/null -w "dashboard %{http_code} %{time_total}s\n" --max-time 120 https://app.kalytera.dev/_stcore/health || true
